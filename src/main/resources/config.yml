# RaidPvP v1.0.0
# Paper / Purpur / Folia 1.21.4+; Java 21 bytecode.
# Newly added keys fall back to built-in defaults, so an older config.yml keeps working.
# Plugin chat messages live in messages.yml. The combat ActionBar / BossBar texts stay here.
# %time% is always a plain number: write the unit yourself (e.g. "%time%s" or "%time% 秒").

settings:
  # RaidPvP does nothing in these worlds (no PvP rules, no combat tag, no newbie/respawn protection).
  disabled-worlds: []
  pvp-toggle:
    # false = /pvp is disabled and EVERY player follows default-enabled (false = PvP off for everyone).
    enabled: true
    default-enabled: true
    change-cooldown-seconds: 10

combat:
  enabled: true
  duration-seconds: 15
  refresh-on-hit: true
  actionbar:
    enabled: true
    message: "&c⚔ 戰鬥中 &7| &f%time%s &7| &c對手: &f%enemy%"
  bossbar:
    enabled: true
    color: RED
    style: SOLID
    # The bar drains smoothly (updated every tick); the text refreshes every second.
    message: "&c⚔ 戰鬥狀態 &7| &f%time%s &7| &c對手: &f%enemy%"
  restrictions:
    block-commands: true
    command-mode: "BLACKLIST" # BLACKLIST or WHITELIST
    commands:
      - "tp"
      - "teleport"
      - "spawn"
      - "home"
      - "homes"
      - "tpa"
      - "tpahere"
      - "warp"
      - "rtp"
      - "back"
      - "fly"
      - "gamemode"
      - "gmc"
      - "gms"
      - "gm"
    block-teleport: true
    block-ender-pearl: true
    block-chorus-fruit: true
    block-spectate: true
    block-block-place: true
    block-block-break: true
    block-interact: false
    block-container-open: false
    blocked-interact-materials: []
    close-inventory-on-tag: true
    disable-fly: true
    disable-gamemode: true
    disable-invisibility: true
    prevent-totem: false
    blocked-items:
      - "ENDER_CHEST"
      - "RESPAWN_ANCHOR"
  item-cooldowns:
    enabled: true
    ENDER_PEARL: 10
    FIREWORK_ROCKET: 1.5
    CHORUS_FRUIT: 5
    TRIDENT: 1
    GOLDEN_APPLE: 0

combat-log:
  # NONE, KILL or NPC. NPC requires Citizens; without Citizens it falls back to KILL.
  mode: "KILL"
  punish-on-kick: true
  # Kicks with these PlayerKickEvent causes are never punished (admin kick, restart, ban...).
  # Server shutdown is always exempt.
  kick-exempt-causes:
    - "KICK_COMMAND"
    - "RESTART_COMMAND"
    - "PLUGIN"
    - "BANNED"
    - "IP_BANNED"
    - "NOT_WHITELISTED"
    - "SERVER_FULL"
  # false (default): the owner may log in at any time and simply takes the NPC's place
  # (with the NPC's current health, at the NPC's position). true: login is blocked until the NPC is gone.
  block-login-while-npc-exists: false
  npc:
    name: "%player%"
    # If nobody kills the NPC within this time it disappears and the owner gets everything back on next login.
    despawn-seconds: 120
    # true = a killed NPC drops the owner's items / XP. false = the owner keeps them and gets them on next login.
    # Items are saved in pending.yml, so they survive restarts and crashes.
    drop-inventory: true
    drop-experience: true
    keep-chunk-loaded: false
  # The broadcast text is "combat-log-broadcast" in messages.yml.
  broadcast: true

newbie:
  enabled: true
  duration-minutes: 30
  protect-from-pvp: true
  protect-from-everything: false
  block-pickup: false
  # BossBar countdown. Placeholders: %time% (plain seconds), %minutes% (plain, rounded up), %mmss% (e.g. 29:59)
  bossbar:
    enabled: true
    color: GREEN
    style: SOLID
    message: "&a🛡 新手保護 &7| &f%mmss%"

respawn-protection:
  enabled: true
  seconds: 2

anti-kill-abuse:
  enabled: true
  max-kills: 5
  window-seconds: 60
  # Combat-logout deaths never count. '&' colour codes are converted for you.
  command: "kick %player% &c禁止短時間重複擊殺同一玩家。"
