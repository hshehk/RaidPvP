# RaidPvP 插件訊息 (messages.yml)
# 顏色碼使用 &。戰鬥狀態的 ActionBar / BossBar 文字在 config.yml 裡設定。
# 倒數類的 %time% 一律只給「純數字」，單位 (s、秒、分鐘...) 請自己寫在訊息裡。
# 可用變數：%time% %minutes% %player% %enemy% %status% %value%
# 缺少的鍵會自動使用內建預設值。

# ---- 一般 ----
no-permission: "&c你沒有權限。"
player-only: "&c這個指令只能由玩家使用。"
player-offline: "&c玩家不在線。"
reload: "&aRaidPvP 設定已重新載入。"
unknown-subcommand: "&c未知子指令。"
unknown-action: "&c未知操作：add/remove/check"
invalid-seconds: "&c秒數必須是整數。"
invalid-minutes: "&c分鐘數必須是整數。"

# ---- 戰鬥 ----
combat-enter: "&c⚔ 你進入戰鬥！ &7(%time%s)"
combat-exit: "&a✔ 你已脫離戰鬥。"
combat-time: "&c你還在戰鬥中：&f%time% 秒。"
not-in-combat: "&a你目前不在戰鬥中。"
combat-log-broadcast: "&c%player% &7戰鬥中登出。"
